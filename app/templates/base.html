<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}GetHired{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark app-navbar">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand fw-semibold"
            href="{{ url_for('dashboard.home') }}">

            GetHired

        </a>

        <span class="navbar-text text-light small">

            Resume & Job Analysis

        </span>

    </div>

</nav>


<main class="app-main">

    <div class="container-fluid px-4">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }} alert-dismissible fade show app-alert"
                        role="alert">

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        {% block content %}

        {% endblock %}

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script
    src="{{ url_for('static', filename='js/app.js') }}">
</script>

</body>

</html>
